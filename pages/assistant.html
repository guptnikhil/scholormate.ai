<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Assistant — ScholarMate AI</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/animations.css" />
</head>
<body data-page="assistant" data-root="../">

  <header class="navbar" id="site-navbar"></header>

  <main class="container" style="padding-top:24px; padding-bottom:24px;">

    <div class="chat-shell">

      <!-- Sidebar: suggested questions -->
      <aside class="chat-sidebar">
        <h3>Suggested Questions</h3>
        <button class="suggested-q" data-q="I'm from Bihar and my income is 80k. What am I eligible for?">
          I'm from Bihar and my income is 80k. What am I eligible for?
        </button>
        <button class="suggested-q" data-q="What scholarships are there for engineering students?">
          Scholarships for engineering students
        </button>
        <button class="suggested-q" data-q="Which scholarship has the nearest deadline?">
          Which scholarship has the nearest deadline?
        </button>
        <button class="suggested-q" data-q="What documents do I need to apply?">
          What documents do I need to apply?
        </button>
        <button class="suggested-q" data-q="I have a disability — what support is available?">
          Scholarships for students with disabilities
        </button>
      </aside>

      <!-- Main chat area -->
      <section class="chat-main">
        <div class="chat-header">
          <div class="chat-avatar">AI</div>
          <div>
            <div style="font-weight:700; font-size:14.5px;">ScholarMate Assistant</div>
            <div class="text-muted" style="font-size:12.5px;">Ask about eligibility, deadlines, or documents</div>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages" aria-live="polite">
          <!-- messages injected by assistant.js -->
        </div>

        <form class="chat-input-bar" id="chatForm">
          <button type="button" class="btn btn-secondary btn-icon mic-btn" id="micBtn" aria-label="Start voice input" title="Click to speak (Voice input)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v4M8 23h8"/></svg>
          </button>
          <textarea id="chatInput" rows="1" placeholder="Describe yourself or ask a question…" aria-label="Message"></textarea>
          <button type="submit" class="btn btn-primary btn-icon" id="sendBtn" aria-label="Send message">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
          </button>
        </form>
      </section>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/assistant.js"></script>
</body>
</html>
