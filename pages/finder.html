<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eligibility Finder — ScholarMate</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/animations.css" />
</head>
<body data-page="finder" data-root="../">

  <header class="navbar" id="site-navbar"></header>

  <main>
    <section class="container page-header" style="padding-top:40px; padding-bottom:12px;">
      <div class="eyebrow" style="margin-bottom:12px;">Profile Evaluation</div>
      <h1>Scholarship Eligibility Finder</h1>
      <p class="text-muted" style="margin-top:10px; max-width:620px; font-size:15px;">
        Provide your academic background, domicile state, and family income below. ScholarMate evaluates your profile against verified government and institutional criteria to rank matching opportunities.
      </p>
    </section>

    <section class="section" style="padding-top:32px;">
      <div class="container">
        <form id="finderForm" class="card fade-up" style="padding:32px; max-width:820px; margin:0 auto;" novalidate>

          <div class="form-grid">
            <div class="field">
              <label for="state">State</label>
              <select id="state" name="state" class="select">
                <option value="Any">Any state</option>
                <option value="Bihar">Bihar</option>
                <option value="Uttar Pradesh">Uttar Pradesh</option>
                <option value="Maharashtra">Maharashtra</option>
                <option value="Tamil Nadu">Tamil Nadu</option>
                <option value="West Bengal">West Bengal</option>
                <option value="Delhi">Delhi</option>
              </select>
            </div>

            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category" class="select">
                <option value="Any">Any category</option>
                <option value="General">General</option>
                <option value="STEM">STEM</option>
                <option value="Minority">Minority</option>
                <option value="Disability">Disability</option>
                <option value="Orphan">Orphan</option>
                <option value="Gender">Gender-focused</option>
              </select>
            </div>

            <div class="field">
              <label for="income">Family Income (annual, ₹)</label>
              <input type="number" id="income" name="income" class="input" placeholder="e.g. 80000" min="0" />
            </div>

            <div class="field">
              <label for="currentClass">Class</label>
              <select id="currentClass" name="currentClass" class="select">
                <option value="">Select class</option>
                <option value="10">Class 10</option>
                <option value="11">Class 11</option>
                <option value="12">Class 12</option>
                <option value="undergraduate">Undergraduate</option>
                <option value="postgraduate">Postgraduate</option>
              </select>
            </div>

            <div class="field">
              <label for="gender">Gender</label>
              <select id="gender" name="gender" class="select">
                <option value="">Prefer not to say</option>
                <option value="female">Female</option>
                <option value="male">Male</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="field">
              <label for="education">Current Education</label>
              <input type="text" id="education" name="education" class="input" placeholder="e.g. B.Tech Computer Science, 2nd year" />
            </div>
          </div>

          <div class="field">
            <label>Disability</label>
            <div class="toggle-group" data-toggle-group="disability">
              <button type="button" class="toggle-chip is-active" data-value="no">No</button>
              <button type="button" class="toggle-chip" data-value="yes">Yes</button>
            </div>
          </div>

          <div class="field">
            <label>Minority Community</label>
            <div class="toggle-group" data-toggle-group="minority">
              <button type="button" class="toggle-chip is-active" data-value="no">No</button>
              <button type="button" class="toggle-chip" data-value="yes">Yes</button>
            </div>
          </div>

          <div class="field" style="margin-bottom:8px;">
            <label>Orphan Status</label>
            <div class="toggle-group" data-toggle-group="orphan">
              <button type="button" class="toggle-chip is-active" data-value="no">No</button>
              <button type="button" class="toggle-chip" data-value="yes">Yes</button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="findBtn" style="margin-top:12px; padding-block:14px;">
            <span id="findBtnLabel">Find Scholarships</span>
          </button>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/finder.js"></script>
</body>
</html>
